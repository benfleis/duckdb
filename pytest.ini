# pytest entry point for a duckdb extension.
#
# Requires: pytest + pytest-xdist
# [uv] pip install pytest pytest-xdist
#
# Running `pytest` within the repo collects all .test files under test/
# executes them via unittest, with a pytest wrapper.
#
# Plugin code: test/py/driver/sqllogic.py
#   SqlLogicFile / SqlLogicItem  — collector and runner for .test files
#   --build debug|release|reldebug  — selects build/TYPE/test/unittest (default: debug);
#                                     $BUILD_DIR overrides the build root when set
#   --catch2-binary PATH            — explicit binary path; use when the binary lives
#                                     outside the standard CMake build tree
#   --batch-size N                  — tests per unittest invocation (default: 10);
#                                     reduces fork overhead; set to 1 for per-test
#                                     skip attribution
#
# Parallelism (addopts below):
#   -n auto          spawn one worker per CPU core (pytest-xdist); override with
#                    -n0 (single process, no xdist) or -n4 etc.
#   --dist=loadgroup tests are grouped into batches of --batch-size and each batch
#                    is one unittest invocation; loadgroup ensures all tests in a
#                    batch land on the same worker so each batch runs only once,
#                    not once per worker that happens to receive one of its items

[pytest]
addopts = -n auto --dist=loadgroup

# Only walk test/ for collection. Keeps pytest out of scripts/, tools/, third_party/,
# and any nested checkout (e.g. duckdb core's local/main/).
testpaths = test

# Disable pytest's native test_*.py file collection. Our collector
# (test/py/driver/sqllogic.py) owns .test discovery; many duckdb repos contain non-pytest
# scripts named test_*.py that run argparse/sys.exit at import (e.g.
# scripts/test_storage_compatibility.py, test/memoryleak/test_memory_leaks.py), which
# otherwise crash collection. Same-stem .py drivers are still collected (conftest hands
# pytest an explicit Module, which bypasses this pattern). Re-scope when the
# py-exclusive .py test lane lands.
python_files =
